<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 280" width="760" height="280" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="280" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-m b">MsgCall app.F, where F calls lib.G(cross(cur), ...)</text>
<g class="f-hot " data-note="At the chain root there is no caller frame. MsgCall synthesizes pkg.F(.origin, args...), and .origin lowers to a crossing call whose prev is built from the signer." tabindex="0">
<rect x="20" y="44" width="200" height="68" rx="6" class="f-box mut"/>
<text x="30" y="62" class="f-t b">signer</text>
<text x="30" y="80" class="f-m s">g1abc... the</text>
<text x="30" y="95" class="f-m s">transaction&#x27;s signer</text>
</g>
<g class="f-hot " data-note="installCrossingCur minted this .grealm value for F. cur.Previous() is the signer, unforgeably." tabindex="0">
<rect x="280" y="44" width="200" height="68" rx="6" class="f-box acc"/>
<text x="290" y="62" class="f-t b">F&#x27;s cur</text>
<text x="290" y="80" class="f-m s">addr: r/demo/app</text>
<text x="290" y="95" class="f-m s">prev → signer</text>
</g>
<g class="f-hot " data-note="Minted for G because F wrote cross(cur). G sees app as its previous realm, whatever helper made the call." tabindex="0">
<rect x="540" y="44" width="200" height="68" rx="6" class="f-box acc"/>
<text x="550" y="62" class="f-t b">G&#x27;s cur</text>
<text x="550" y="80" class="f-m s">addr: r/demo/lib</text>
<text x="550" y="95" class="f-m s">prev → app</text>
</g>
<path d="M220 78L279 78" class="f-ar "/>
<text x="249.5" y="70" class="f-t s" text-anchor="middle">.origin</text>
<path d="M480 78L539 78" class="f-ar "/>
<text x="509.5" y="70" class="f-t s" text-anchor="middle">cross(cur)</text>
<path d="M540 100 C500 130 300 130 221 100" class="f-ar dash"/>
<text x="380" y="138" class="f-t s" text-anchor="middle">cur.Previous()</text>
<path d="M280 100 C250 130 40 130 21 100" class="f-ar dash"/>
<text x="150" y="138" class="f-t s" text-anchor="middle">cur.Previous()</text>
<g class="f-hot " data-note="Calling a crossing function with a bare cur is only legal within its own realm." tabindex="0">
<rect x="20" y="160" width="350" height="74" rx="6" class="f-box "/>
<text x="30" y="178" class="f-t b">H(cur) inside the same realm</text>
<text x="30" y="194" class="f-t s">no new link: H receives F&#x27;s cur unchanged. Written</text>
<text x="30" y="207" class="f-t s">against another realm&#x27;s function, the preprocessor</text>
<text x="30" y="220" class="f-t s">rejects it.</text>
</g>
<g class="f-hot " data-note="The older API. Prefer cur.Previous(), which reads the captured chain." tabindex="0">
<rect x="390" y="160" width="350" height="74" rx="6" class="f-box warn"/>
<text x="400" y="178" class="f-t b">chain/runtime/unsafe</text>
<text x="400" y="194" class="f-t s">PreviousRealm and CurrentRealm walk the frames counting</text>
<text x="400" y="207" class="f-t s">WithCross frames and can be fooled from a helper. Hence</text>
<text x="400" y="220" class="f-t s">the name.</text>
</g>
<text x="20" y="262" class="f-t s">Realm values are never persisted: store the address instead. main(cur realm) and init(cur realm) are called with .cur, already crossed.</text>
</svg>

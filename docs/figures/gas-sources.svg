<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 514" width="760" height="514" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="514" class="f-bg" rx="8"/>
<g class="f-hot " data-note="One gas is one nanosecond on the reference Xeon. cmd/calibrate produced the constants." tabindex="0">
<rect x="20" y="30" width="172" height="226" rx="6" class="f-box "/>
<text x="30" y="48" class="f-t b">CPU</text>
<text x="30" y="64" class="f-t s">a constant per opcode:</text>
<text x="30" y="77" class="f-t s">OpExec 130, OpEval 82,</text>
<text x="30" y="90" class="f-t s">int add 81, OpDefine</text>
<text x="30" y="103" class="f-t s">114</text>
<text x="30" y="122" class="f-t s">slopes: per unit of</text>
<text x="30" y="135" class="f-t s">name depth, per name</text>
<text x="30" y="148" class="f-t s">defined, per parameter,</text>
<text x="30" y="161" class="f-t s">per element, per bit</text>
<text x="30" y="180" class="f-t s">natives: a table by</text>
<text x="30" y="193" class="f-t s">package and name</text>
<text x="30" y="212" class="f-t s">output formatting: 4</text>
<text x="30" y="225" class="f-t s">gas per byte</text>
</g>
<path d="M106 256L106 283" class="f-ar "/>
<g class="f-hot " data-note="An accounting GC: Go&#x27;s collector frees the memory, the VM only recounts." tabindex="0">
<rect x="202" y="30" width="172" height="226" rx="6" class="f-box "/>
<text x="212" y="48" class="f-t b">Allocation</text>
<text x="212" y="64" class="f-t s">bytes per value,</text>
<text x="212" y="77" class="f-t s">500,000,000 per message</text>
<text x="212" y="96" class="f-t s">gas from a table by the</text>
<text x="212" y="109" class="f-t s">base-2 log of the size</text>
<text x="212" y="128" class="f-t s">over budget: recount</text>
<text x="212" y="141" class="f-t s">every reachable object,</text>
<text x="212" y="154" class="f-t s">charged per visit, and</text>
<text x="212" y="167" class="f-t s">continue if it fits</text>
</g>
<path d="M288 256L288 283" class="f-ar "/>
<g class="f-hot " data-note="Flat and per-byte fees are tm2 code defaults; depths are VM parameters." tabindex="0">
<rect x="384" y="30" width="172" height="226" rx="6" class="f-box "/>
<text x="394" y="48" class="f-t b">Store</text>
<text x="394" y="64" class="f-t s">encoding: 3 gas per</text>
<text x="394" y="77" class="f-t s">byte, each way</text>
<text x="394" y="96" class="f-t s">a cache miss: a flat</text>
<text x="394" y="109" class="f-t s">fee plus a per-byte</text>
<text x="394" y="122" class="f-t s">fee; a hit is free</text>
<text x="394" y="141" class="f-t s">a write: a flat fee</text>
<text x="394" y="154" class="f-t s">plus a per-byte fee; a</text>
<text x="394" y="167" class="f-t s">key written twice is</text>
<text x="394" y="180" class="f-t s">billed once</text>
<text x="394" y="199" class="f-t s">the Merkle tree scales</text>
<text x="394" y="212" class="f-t s">the flat fee by depth</text>
</g>
<path d="M470 256L470 283" class="f-ar "/>
<g class="f-hot " data-note="preprocess_gas_per_byte is a VM parameter; its code default is 1,250." tabindex="0">
<rect x="566" y="30" width="172" height="226" rx="6" class="f-box "/>
<text x="576" y="48" class="f-t b">Code size</text>
<text x="576" y="64" class="f-t s">MsgAddPackage and</text>
<text x="576" y="77" class="f-t s">MsgRun</text>
<text x="576" y="96" class="f-t s">preprocess_gas_per_byte</text>
<text x="576" y="109" class="f-t s">for each source byte</text>
<text x="576" y="128" class="f-t s">charged before the</text>
<text x="576" y="141" class="f-t s">type-check</text>
</g>
<path d="M652 256L652 283" class="f-ar "/>
<rect x="20" y="284" width="720" height="46" rx="6" class="f-box mut"/>
<text x="380" y="304" class="f-t b" text-anchor="middle">one gas meter per transaction</text>
<text x="380" y="321" class="f-t s" text-anchor="middle">opened by the ante handler, which first charges the transaction&#x27;s bytes and signatures</text>
<text x="20" y="358" class="f-t s">Paid in coins, beside the meter, and returned when the bytes are freed:</text>
<g class="f-hot " data-note="Settled after each message by processStorageDeposit, from the byte changes finalization reports." tabindex="0">
<rect x="20" y="368" width="360" height="90" rx="6" class="f-box acc"/>
<text x="30" y="386" class="f-t b">Storage deposit</text>
<text x="30" y="402" class="f-t s">bytes a realm grew × storage_price, a VM parameter</text>
<text x="30" y="421" class="f-t s">refunded in proportion: deposit × freed bytes /</text>
<text x="30" y="434" class="f-t s">stored bytes</text>
</g>
<path d="M380 413L419 413" class="f-ar "/>
<g class="f-hot " data-note="An address computed from the realm&#x27;s path. The total one message locks may not exceed the caller&#x27;s -max-deposit, or default_deposit when none is set." tabindex="0">
<rect x="420" y="368" width="320" height="90" rx="6" class="f-box "/>
<text x="430" y="386" class="f-t b">The realm&#x27;s storage deposit address</text>
<text x="430" y="402" class="f-t s">coins locked from the caller; a refund goes</text>
<text x="430" y="415" class="f-t s">back to the caller, or to</text>
<text x="430" y="428" class="f-t s">storage_fee_collector when ugnot is restricted</text>
</g>
<text x="20" y="482" class="f-t s">Queries run under their own meter and allocator, 3 billion gas and 1.5 GB, both code constants, and are never</text>
<text x="20" y="498" class="f-t s">committed.</text>
</svg>

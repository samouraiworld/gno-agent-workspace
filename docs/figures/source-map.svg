<g class="f-hot " data-note="The command line tool. It imports everything, including the keeper, which it uses for the query commands." tabindex="0">
<rect x="20" y="52" width="168" height="30" rx="6" class="f-box "/>
<text x="104" y="71" class="f-m" text-anchor="middle">gnovm/cmd/gno</text>
</g>
<g class="f-hot " data-note="The node application: mounts the stores, installs the ante handler and registers the routes." tabindex="0">
<rect x="572" y="52" width="168" height="30" rx="6" class="f-box "/>
<text x="656" y="71" class="f-m" text-anchor="middle">gno.land/pkg/gnoland</text>
</g>

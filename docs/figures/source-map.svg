</g>
<g class="f-hot " data-note="The gnomod.toml manifest. A leaf." tabindex="0">
<rect x="20" y="372" width="168" height="30" rx="6" class="f-box "/>
<text x="104" y="391" class="f-m" text-anchor="middle">gnovm/pkg/gnomod</text>
</g>
<g class="f-hot " data-note="The VM itself. It imports only the manifest reader, the parser copy and the optional benchmarking hooks, so nothing above it is needed to run Gno." tabindex="0">

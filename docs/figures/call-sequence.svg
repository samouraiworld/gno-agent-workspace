<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 370" width="760" height="370" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="370" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-m b">y := f(a, b)</text>
<g class="f-hot " id="call-1" data-note="The call expression y := f(a, b). Because pushes go in reverse, the callee is read before any argument." tabindex="0">
<rect x="20" y="40" width="232" height="140" rx="6" class="f-box "/>
<text x="30" y="58" class="f-t b">1 · OpEval on the call</text>
<text x="30" y="74" class="f-t s">pushes OpPrecall, then an OpEval</text>
<text x="30" y="87" class="f-t s">per argument in reverse, then one</text>
<text x="30" y="100" class="f-t s">for the callee, so the callee</text>
<text x="30" y="113" class="f-t s">evaluates first: Values f, a, b</text>
</g>
<path d="M252 110L263 110" class="f-ar "/>
<g class="f-hot " id="call-2" data-note="PushFrameCall also decides the storage realm for the call, the borrow rules. A call written f(cross(cur), ...) gets a fresh cur from installCrossingCur." tabindex="0">
<rect x="264" y="40" width="232" height="140" rx="6" class="f-box acc"/>
<text x="274" y="58" class="f-t b">2 · OpPrecall</text>
<text x="274" y="74" class="f-t s">peeks the callee under the</text>
<text x="274" y="87" class="f-t s">arguments. A type: OpConvert, no</text>
<text x="274" y="100" class="f-t s">frame. A function: push a frame</text>
<text x="274" y="113" class="f-t s">and OpCall, plus OpEnterCrossing</text>
<text x="274" y="126" class="f-t s">for a crossing function. A nil</text>
<text x="274" y="139" class="f-t s">callee panics: call of nil</text>
<text x="274" y="152" class="f-t s">function</text>
</g>
<path d="M496 110L507 110" class="f-ar "/>
<g class="f-hot " id="call-3" data-note="The block&#x27;s slots hold the parameters, then the results, then the locals. The parent is the file block for a top-level function; a closure has none." tabindex="0">
<rect x="508" y="40" width="232" height="140" rx="6" class="f-box "/>
<text x="518" y="58" class="f-t b">3 · OpCall</text>
<text x="518" y="74" class="f-t s">a block from the machine&#x27;s pool</text>
<text x="518" y="87" class="f-t s">or freshly allocated, its parent</text>
<text x="518" y="100" class="f-t s">the file block; captured heap</text>
<text x="518" y="113" class="f-t s">items copied in; results zeroed;</text>
<text x="518" y="126" class="f-t s">arguments popped into the first</text>
<text x="518" y="139" class="f-t s">slots, variadic ones packed</text>
</g>
<g class="f-hot " id="call-4" data-note="A native function is a FuncValue with a Go body, attached by DefineNative for builtins, looked up in the store for the standard library." tabindex="0">
<rect x="20" y="210" width="232" height="140" rx="6" class="f-box "/>
<text x="30" y="228" class="f-t b">4 · Body</text>
<text x="30" y="244" class="f-t s">Gno function: OpBody with the</text>
<text x="30" y="257" class="f-t s">statements, plus a synthetic</text>
<text x="30" y="270" class="f-t s">return when it declares no</text>
<text x="30" y="283" class="f-t s">results. Native: OpReturn then</text>
<text x="30" y="296" class="f-t s">OpCallNativeBody. defer: evaluate</text>
<text x="30" y="309" class="f-t s">now, push a Defer on the frame</text>
</g>
<path d="M252 280L263 280" class="f-ar "/>
<g class="f-hot " id="call-5" data-note="The return statement and the frame choose the form." tabindex="0">
<rect x="264" y="210" width="232" height="140" rx="6" class="f-box "/>
<text x="274" y="228" class="f-t b">5 · OpReturn, four forms</text>
<text x="274" y="244" class="f-t s">OpReturn; OpReturnAfterCopy when</text>
<text x="274" y="257" class="f-t s">results are named and return</text>
<text x="274" y="270" class="f-t s">lists values; OpReturnFromBlock</text>
<text x="274" y="283" class="f-t s">for a bare return;</text>
<text x="274" y="296" class="f-t s">OpReturnToBlock plus the sticky</text>
<text x="274" y="309" class="f-t s">OpReturnCallDefers when the frame</text>
<text x="274" y="322" class="f-t s">holds defers</text>
</g>
<path d="M496 280L507 280" class="f-ar "/>
<g class="f-hot " id="call-6" data-note="This is where a realm call ends and its objects are saved." tabindex="0">
<rect x="508" y="210" width="232" height="140" rx="6" class="f-box acc"/>
<text x="518" y="228" class="f-t b">6 · Pop the frame</text>
<text x="518" y="244" class="f-t s">maybeFinalize saves the realm if</text>
<text x="518" y="257" class="f-t s">the frame is a realm boundary;</text>
<text x="518" y="270" class="f-t s">then the stacks are cut back to</text>
<text x="518" y="283" class="f-t s">the recorded heights, the call&#x27;s</text>
<text x="518" y="296" class="f-t s">blocks released to the pool, the</text>
<text x="518" y="309" class="f-t s">results moved down, the caller&#x27;s</text>
<text x="518" y="322" class="f-t s">package and realm restored</text>
</g>
<path d="M624 180 L624 195 L136 195 L136 209" class="f-ar "/>
</svg>

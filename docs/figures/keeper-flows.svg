<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 432" width="760" height="432" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="432" class="f-bg" rx="8"/>
<g class="f-hot " data-note="MsgAddPackage. The package runs once and is saved; every later call skips to execution. Under the inert policy the package is parked instead, and MsgEnablePackage runs these steps after approval." tabindex="0">
<rect x="20" y="30" width="172" height="30" rx="4" class="f-box acc"/>
<text x="106" y="50" class="f-t b" text-anchor="middle">AddPackage</text>
<rect x="20" y="66" width="172" height="48" rx="4" class="f-box "/>
<text x="28" y="82" class="f-t s">validate the path;</text>
<text x="28" y="95" class="f-t s">refuse an existing</text>
<text x="28" y="108" class="f-t s">public package</text>
<path d="M106 114L106 119" class="f-ar thin"/>
<rect x="20" y="120" width="172" height="48" rx="4" class="f-box "/>
<text x="28" y="136" class="f-t s">gas per source byte;</text>
<text x="28" y="149" class="f-t s">type-check production</text>
<text x="28" y="162" class="f-t s">files, strict</text>
<path d="M106 168L106 173" class="f-ar thin"/>
<rect x="20" y="174" width="172" height="48" rx="4" class="f-box "/>
<text x="28" y="190" class="f-t s">manifest rules; names</text>
<text x="28" y="203" class="f-t s">and CLA realms; coins to</text>
<text x="28" y="216" class="f-t s">the package address</text>
<path d="M106 222L106 227" class="f-ar thin"/>
<rect x="20" y="228" width="172" height="48" rx="4" class="f-box "/>
<text x="28" y="244" class="f-t s">preprocess allocator:</text>
<text x="28" y="257" class="f-t s">folding is metered</text>
<path d="M106 276L106 281" class="f-ar thin"/>
<rect x="20" y="282" width="172" height="48" rx="4" class="f-box "/>
<text x="28" y="298" class="f-t s">run with saving on:</text>
<text x="28" y="311" class="f-t s">variables, then each</text>
<text x="28" y="324" class="f-t s">init</text>
<path d="M106 330L106 335" class="f-ar thin"/>
<rect x="20" y="336" width="172" height="48" rx="4" class="f-box "/>
<text x="28" y="352" class="f-t s">settle the storage</text>
<text x="28" y="365" class="f-t s">deposit</text>
</g>
<g class="f-hot " data-note="MsgCall. The arguments arrive as strings and are converted to the parameter types." tabindex="0">
<rect x="202" y="30" width="172" height="30" rx="4" class="f-box acc"/>
<text x="288" y="50" class="f-t b" text-anchor="middle">Call</text>
<rect x="202" y="66" width="172" height="48" rx="4" class="f-box "/>
<text x="210" y="82" class="f-t s">refuse a non-crossing</text>
<text x="210" y="95" class="f-t s">function</text>
<path d="M288 114L288 119" class="f-ar thin"/>
<rect x="202" y="120" width="172" height="48" rx="4" class="f-box "/>
<text x="210" y="136" class="f-t s">bind the package as pkg</text>
<text x="210" y="149" class="f-t s">in a throwaway main</text>
<path d="M288 168L288 173" class="f-ar thin"/>
<rect x="202" y="174" width="172" height="48" rx="4" class="f-box "/>
<text x="210" y="190" class="f-t s">parse pkg.F(cross,</text>
<text x="210" y="203" class="f-t s">args...) written as text</text>
<path d="M288 222L288 227" class="f-ar thin"/>
<rect x="202" y="228" width="172" height="48" rx="4" class="f-box "/>
<text x="210" y="244" class="f-t s">replace the first</text>
<text x="210" y="257" class="f-t s">argument with .origin</text>
<path d="M288 276L288 281" class="f-ar thin"/>
<rect x="202" y="282" width="172" height="48" rx="4" class="f-box "/>
<text x="210" y="298" class="f-t s">evaluate; results joined</text>
<text x="210" y="311" class="f-t s">as strings</text>
<path d="M288 330L288 335" class="f-ar thin"/>
<rect x="202" y="336" width="172" height="48" rx="4" class="f-box "/>
<text x="210" y="352" class="f-t s">refuse coins never read;</text>
<text x="210" y="365" class="f-t s">settle the deposit</text>
</g>
<g class="f-hot " data-note="MsgRun. A throwaway main package; nothing persists beyond what its calls write into other realms." tabindex="0">
<rect x="384" y="30" width="172" height="30" rx="4" class="f-box acc"/>
<text x="470" y="50" class="f-t b" text-anchor="middle">Run</text>
<rect x="384" y="66" width="172" height="48" rx="4" class="f-box "/>
<text x="392" y="82" class="f-t s">path forced to</text>
<text x="392" y="95" class="f-t s">&lt;domain&gt;/e/&lt;caller&gt;/run</text>
<path d="M470 114L470 119" class="f-ar thin"/>
<rect x="384" y="120" width="172" height="48" rx="4" class="f-box "/>
<text x="392" y="136" class="f-t s">gas per byte; relaxed</text>
<text x="392" y="149" class="f-t s">type-check, manifest</text>
<text x="392" y="162" class="f-t s">optional</text>
<path d="M470 168L470 173" class="f-ar thin"/>
<rect x="384" y="174" width="172" height="48" rx="4" class="f-box "/>
<text x="392" y="190" class="f-t s">the package is marked</text>
<text x="392" y="203" class="f-t s">private</text>
<path d="M470 222L470 227" class="f-ar thin"/>
<rect x="384" y="228" width="172" height="48" rx="4" class="f-box "/>
<text x="392" y="244" class="f-t s">run without saving</text>
<path d="M470 276L470 281" class="f-ar thin"/>
<rect x="384" y="282" width="172" height="48" rx="4" class="f-box "/>
<text x="392" y="298" class="f-t s">main called in a second</text>
<text x="392" y="311" class="f-t s">machine</text>
<path d="M470 330L470 335" class="f-ar thin"/>
<rect x="384" y="336" width="172" height="48" rx="4" class="f-box "/>
<text x="392" y="352" class="f-t s">output returned; the</text>
<text x="392" y="365" class="f-t s">script is never stored</text>
</g>
<g class="f-hot " data-note="vm/qeval and vm/qrender. Read-only, on a forked store that is dropped afterwards." tabindex="0">
<rect x="566" y="30" width="172" height="30" rx="4" class="f-box acc"/>
<text x="652" y="50" class="f-t b" text-anchor="middle">Query</text>
<rect x="566" y="66" width="172" height="48" rx="4" class="f-box "/>
<text x="574" y="82" class="f-t s">fork a throwaway store</text>
<text x="574" y="95" class="f-t s">over a committed</text>
<text x="574" y="108" class="f-t s">snapshot</text>
<path d="M652 114L652 119" class="f-ar thin"/>
<rect x="566" y="120" width="172" height="48" rx="4" class="f-box "/>
<text x="574" y="136" class="f-t s">load the package</text>
<path d="M652 168L652 173" class="f-ar thin"/>
<rect x="566" y="174" width="172" height="48" rx="4" class="f-box "/>
<text x="574" y="190" class="f-t s">parse the expression;</text>
<text x="574" y="203" class="f-t s">.cur prepended for a</text>
<text x="574" y="216" class="f-t s">crossing callee</text>
<path d="M652 222L652 227" class="f-ar thin"/>
<rect x="566" y="228" width="172" height="48" rx="4" class="f-box "/>
<text x="574" y="244" class="f-t s">evaluate under 3 billion</text>
<text x="574" y="257" class="f-t s">gas and 1.5 GB</text>
<path d="M652 276L652 281" class="f-ar thin"/>
<rect x="566" y="282" width="172" height="48" rx="4" class="f-box "/>
<text x="574" y="298" class="f-t s">qrender is the same with</text>
<text x="574" y="311" class="f-t s">Render(path)</text>
<path d="M652 330L652 335" class="f-ar thin"/>
<rect x="566" y="336" width="172" height="48" rx="4" class="f-box "/>
<text x="574" y="352" class="f-t s">never committed</text>
</g>
<text x="20" y="406" class="f-t s">Restart: Initialize re-preprocesses every stored package, type-checks the standard library into the permanent</text>
<text x="20" y="422" class="f-t s">cache and loads its bytes into memory.</text>
</svg>

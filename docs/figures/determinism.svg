<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 330" width="760" height="330" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="330" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-t b">Source of drift between validators</text>
<text x="290" y="24" class="f-t b">What the VM does</text>
<rect x="20" y="40" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="57" class="f-t">goroutines, channels, select</text>
<path d="M270 53L289 53" class="f-ar "/>
<rect x="290" y="40" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="57" class="f-t">the parser refuses go, select and channels</text>
<rect x="20" y="72" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="89" class="f-t">the CPU&#x27;s floating point</text>
<path d="M270 85L289 85" class="f-ar "/>
<rect x="290" y="72" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="89" class="f-t">software floats, so every node computes the same bits</text>
<rect x="20" y="104" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="121" class="f-t">Go map iteration order</text>
<path d="M270 117L289 117" class="f-ar "/>
<rect x="290" y="104" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="121" class="f-t">a map ranges in insertion order</text>
<rect x="20" y="136" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="153" class="f-t">clock, randomness, network</text>
<path d="M270 149L289 149" class="f-ar "/>
<rect x="290" y="136" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="153" class="f-t">time.Now is the block time; math/rand starts from a fixed seed</text>
<rect x="20" y="168" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="185" class="f-t">the capacity of []byte(s)</text>
<path d="M270 181L289 181" class="f-ar "/>
<rect x="290" y="168" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="185" class="f-t">equals the length, for []rune(s) too; Go leaves it open</text>
<rect x="20" y="200" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="217" class="f-t">gas</text>
<path d="M270 213L289 213" class="f-ar "/>
<rect x="290" y="200" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="217" class="f-t">constants by operand kind and size, never timed</text>
<rect x="20" y="232" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="249" class="f-t">the type-check verdict</text>
<path d="M270 245L289 245" class="f-ar "/>
<rect x="290" y="232" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="249" class="f-t">Go 1.18 rules everywhere; a failure records one fixed error</text>
<rect x="20" y="264" width="250" height="26" rx="4" class="f-box warn"/>
<text x="30" y="281" class="f-t">panic messages</text>
<path d="M270 277L289 277" class="f-ar "/>
<rect x="290" y="264" width="450" height="26" rx="4" class="f-box acc"/>
<text x="300" y="281" class="f-t">the hashed error is the panic value; traces go to the log</text>
<text x="20" y="310" class="f-t s">Determinism is enforced in the language, not trusted to the program: the same transaction yields the same state</text>
<text x="20" y="326" class="f-t s">on every node.</text>
</svg>

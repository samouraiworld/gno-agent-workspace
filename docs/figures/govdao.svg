<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 420" width="760" height="420" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="420" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-t h">Tiers, from r/gov/dao/v3/memberstore</text>
<g class="f-hot " data-note="Core members. Added and promoted by proposal only; a T1 proposal is voted by T1." tabindex="0">
<rect x="20" y="40" width="234" height="100" rx="6" class="f-box acc"/>
<text x="30" y="58" class="f-t b">T1</text>
<text x="30" y="76" class="f-t s">base power 3</text>
<text x="30" y="91" class="f-t s">3 invitation points</text>
<text x="30" y="106" class="f-t s">at least 70 members</text>
<text x="30" y="121" class="f-t s">power uncapped</text>
</g>
<g class="f-hot " data-note="When the cap binds, each T2 member&#x27;s power shrinks to fit: the tier as a whole never outweighs two thirds of T1." tabindex="0">
<rect x="266" y="40" width="234" height="100" rx="6" class="f-box "/>
<text x="276" y="58" class="f-t b">T2</text>
<text x="276" y="76" class="f-t s">base power 2</text>
<text x="276" y="91" class="f-t s">2 invitation points</text>
<text x="276" y="106" class="f-t s">a quarter to twice the T1 count</text>
<text x="276" y="121" class="f-t s">total power ≤ 2/3 of T1&#x27;s</text>
</g>
<g class="f-hot " data-note="Added directly by a T1 or T2 member, who spends one invitation point. Not by proposal." tabindex="0">
<rect x="512" y="40" width="234" height="100" rx="6" class="f-box mut"/>
<text x="522" y="58" class="f-t b">T3</text>
<text x="522" y="76" class="f-t s">base power 1</text>
<text x="522" y="91" class="f-t s">1 invitation point</text>
<text x="522" y="106" class="f-t s">no size rule</text>
<text x="522" y="121" class="f-t s">total power ≤ 1/3 of T1&#x27;s</text>
</g>
<text x="20" y="176" class="f-t h">A proposal, from r/gov/dao/v3/impl</text>
<g class="f-hot " data-note="Seven request types: change the law, upgrade the implementation, add, withdraw or promote a member, pay from the treasury, update the GRC-20 list." tabindex="0">
<rect x="20" y="192" width="170" height="76" rx="6" class="f-box "/>
<text x="30" y="210" class="f-t b">create</text>
<text x="30" y="228" class="f-t s">title, description</text>
<text x="30" y="243" class="f-t s">executor callback</text>
</g>
<path d="M190 230L202 230" class="f-ar "/>
<g class="f-hot " data-note="Percentages are computed against all eligible voting power, so a member who does not vote weighs like a NO. A member proposal restricts the vote to the target tier." tabindex="0">
<rect x="203" y="192" width="170" height="76" rx="6" class="f-box "/>
<text x="213" y="210" class="f-t b">vote</text>
<text x="213" y="228" class="f-t s">YES, NO, ABSTAIN</text>
<text x="213" y="243" class="f-t s">against total power</text>
</g>
<path d="M373 230L385 230" class="f-ar "/>
<g class="f-hot " data-note="The Law&#x27;s Supermajority value, changeable by a change-law proposal." tabindex="0">
<rect x="386" y="192" width="170" height="76" rx="6" class="f-box acc"/>
<text x="396" y="210" class="f-t b">66.66% YES</text>
<text x="396" y="228" class="f-t s">accepted</text>
<text x="396" y="243" class="f-t s">executor runs</text>
</g>
<g class="f-hot " data-note="Symmetric: the same threshold closes the proposal." tabindex="0">
<rect x="569" y="192" width="170" height="76" rx="6" class="f-box warn"/>
<text x="579" y="210" class="f-t b">66.66% NO</text>
<text x="579" y="228" class="f-t s">denied</text>
</g>
<path d="M288 268 L288 290 L654 290 L654 268" class="f-ar warn"/>
<text x="20" y="322" class="f-t s">r/gov/dao is a proxy: UpdateImpl swaps the implementation by proposal, within an allowed list.</text>
<text x="20" y="339" class="f-t s">What it controls: the validator set (r/sys/validators), chain parameters (r/sys/params), the treasury,</text>
<text x="20" y="356" class="f-t s">name registration controllers and prices (r/sys/users, r/sys/namereg), and the namespace verifier&#x27;s pause.</text>
<text x="20" y="373" class="f-t s">A fresh chain starts with one T1 member, who proposes the next ones.</text>
</svg>

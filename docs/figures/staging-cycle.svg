<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 250" width="760" height="250" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="250" class="f-bg" rx="8"/>
<g class="f-hot " data-note="The chain behaves like any network while master does not change." tabindex="0">
<rect x="20" y="50" width="136" height="70" rx="6" class="f-box acc"/>
<text x="30" y="65" class="f-t b">staging runs</text>
</g>
<path d="M156 85L165 85" class="f-ar "/>
<g class="f-hot " data-note="A merge on the gno monorepo triggers a rebuild." tabindex="0">
<rect x="166" y="50" width="136" height="70" rx="6" class="f-box "/>
<text x="176" y="65" class="f-t b">master changes</text>
</g>
<path d="M302 85L311 85" class="f-ar "/>
<g class="f-hot " data-note="Every transaction so far is exported, so the history survives the rebuild." tabindex="0">
<rect x="312" y="50" width="136" height="70" rx="6" class="f-box "/>
<text x="322" y="65" class="f-t b">tx-archive saves</text>
<text x="322" y="80" class="f-t b">every transaction</text>
</g>
<path d="M448 85L457 85" class="f-ar "/>
<g class="f-hot " data-note="All packages under examples/ are deployed first; permissionless deploys of the same path are superseded." tabindex="0">
<rect x="458" y="50" width="136" height="70" rx="6" class="f-box "/>
<text x="468" y="65" class="f-t b">a new genesis</text>
<text x="468" y="80" class="f-t b">from master,</text>
<text x="468" y="95" class="f-t b">examples/</text>
<text x="468" y="110" class="f-t b">redeployed</text>
</g>
<path d="M594 85L603 85" class="f-ar "/>
<g class="f-hot " data-note="A transaction that no longer passes under the new master fails to replay, and its data is lost. Heights and timestamps restart." tabindex="0">
<rect x="604" y="50" width="136" height="70" rx="6" class="f-box "/>
<text x="614" y="65" class="f-t b">the archive</text>
<text x="614" y="80" class="f-t b">replays into it</text>
</g>
<path d="M672 120 L672 160 L88 160 L88 120" class="f-ar "/>
<text x="380" y="180" class="f-t s" text-anchor="middle">back to running, with the old transactions replayed and the new code live</text>
<text x="20" y="226" class="f-t s">From docs/resources/gnoland-networks.md. Pearl, sapphire and topaz are the opposite: fresh genesis, no replay.</text>
</svg>

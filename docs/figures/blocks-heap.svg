<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 500" width="760" height="500" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="500" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-t h">Blocks alive inside add(3), from the names filetest above</text>
<g class="f-hot " data-note="The bottom of every scope chain in this package. Its parent is the universe block. Package variables sit in heap items, which is why the dump marks them with ~." tabindex="0">
<rect x="20" y="44" width="210" height="82" rx="6" class="f-box "/>
<text x="30" y="61" class="f-t b">package block</text>
<text x="30" y="78" class="f-m s">0  total  → HeapItem</text>
<text x="30" y="94" class="f-m s">1  add    FuncValue</text>
<text x="30" y="110" class="f-m s">2  main   FuncValue</text>
</g>
<g class="f-hot " data-note="One block per file, between the function blocks and the package block. It is why a package variable is three hops from a function body." tabindex="0">
<rect x="20" y="156" width="210" height="50" rx="6" class="f-box "/>
<text x="30" y="173" class="f-t b">file block</text>
<text x="30" y="190" class="f-m s">(one per file)</text>
</g>
<g class="f-hot " data-note="Created by OpCall from add&#x27;s source node with one slot per declared name. NewBlock pre-fills the heap-marked slots with heap items; writes go into the item, not over it." tabindex="0">
<rect x="20" y="236" width="210" height="98" rx="6" class="f-box acc"/>
<text x="30" y="253" class="f-t b">add&#x27;s block</text>
<text x="30" y="270" class="f-m s">0  n      → HeapItem</text>
<text x="30" y="286" class="f-m s">1  .res.0</text>
<text x="30" y="302" class="f-m s">2  sum    → HeapItem</text>
<text x="30" y="318" class="f-m s">3  f      FuncValue</text>
</g>
<g class="f-hot " data-note="One per loop. At the end of each iteration the VM replaces every heap item in the init slots with a new one, which is how closures see Go 1.22 loop variables. Here i is not captured, so it is a plain slot." tabindex="0">
<rect x="20" y="364" width="210" height="50" rx="6" class="f-box "/>
<text x="30" y="381" class="f-t b">for block</text>
<text x="30" y="398" class="f-m s">0  i.loopvar</text>
</g>
<path d="M230 166L230 130" class="f-ar "/>
<text x="258" y="151" class="f-t s" text-anchor="middle">Parent</text>
<path d="M230 246L230 210" class="f-ar "/>
<path d="M230 374L230 338" class="f-ar "/>
<text x="20" y="438" class="f-t s">The if arm gets a block too, with no names of its own here.</text>
<g class="f-hot " id="hi-n" data-note="A one-slot box. Pointers and captures reference the item, so the value survives the block it was declared in." tabindex="0">
<rect x="330" y="236" width="170" height="46" rx="6" class="f-box mut"/>
<text x="340" y="254" class="f-t b">HeapItem</text>
<text x="340" y="271" class="f-t s">Value: n = 3</text>
</g>
<g class="f-hot " id="hi-sum" data-note="The same kind of box for sum. Assignments in the loop write into this item." tabindex="0">
<rect x="330" y="300" width="170" height="46" rx="6" class="f-box mut"/>
<text x="340" y="318" class="f-t b">HeapItem</text>
<text x="340" y="335" class="f-t s">Value: sum</text>
</g>
<path d="M230 266L329 259" class="f-ar "/>
<path d="M230 298L329 323" class="f-ar "/>
<g class="f-hot " data-note="Created by OpFuncLit. The capture list from the dump, sum then n, is copied out of add&#x27;s block into Captures. Each call of f copies the items into a fresh block, so a persisted closure never references the block it was born in." tabindex="0">
<rect x="540" y="236" width="200" height="92" rx="6" class="f-box "/>
<text x="550" y="254" class="f-t b">FuncValue f</text>
<text x="550" y="271" class="f-t s">Captures: [HeapItem sum,</text>
<text x="550" y="285" class="f-t s">HeapItem n]</text>
<text x="550" y="299" class="f-t s">body: return sum + n</text>
<text x="550" y="313" class="f-t s">source, type, parent block</text>
</g>
<path d="M540 276L501 259" class="f-ar acc"/>
<path d="M540 286L501 323" class="f-ar acc"/>
<g class="f-hot " data-note="Taking the address of a captured or escaping local yields a pointer whose base is the heap item, never the block." tabindex="0">
<rect x="540" y="346" width="200" height="60" rx="6" class="f-box mut"/>
<text x="550" y="364" class="f-t b">&amp;sum</text>
<text x="550" y="381" class="f-m s">PointerValue{Base:</text>
<text x="550" y="395" class="f-m s">HeapItem, Index 0}</text>
</g>
<path d="M540 369L501 330" class="f-ar dash"/>
<text x="330" y="436" class="f-t s">When add returns, its block and the for and if blocks are popped</text>
<text x="330" y="451" class="f-t s">and gone. The two heap items stay alive inside f&#x27;s captures. That</text>
<text x="330" y="466" class="f-t s">is the whole memory model: blocks are transient, heap items are</text>
<text x="330" y="481" class="f-t s">what escape.</text>
</svg>

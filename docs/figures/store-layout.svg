<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 364" width="760" height="364" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="364" class="f-bg" rx="8"/>
<rect x="20" y="30" width="720" height="160" rx="6" class="f-box mut"/>
<text x="30" y="50" class="f-t b">defaultStore, the only Store implementation</text>
<g class="f-hot " data-note="Objects live here. The adapter commits with no hash, so this store does not feed the application hash." tabindex="0">
<rect x="30" y="62" width="345" height="118" rx="6" class="f-box "/>
<text x="40" y="80" class="f-t b">baseStore: a plain database adapter on baseKey</text>
<text x="40" y="98" class="f-m s">oid:&lt;pkgid&gt;:&lt;newtime&gt;   objects, hash || bytes</text>
<text x="40" y="113" class="f-m s">tid:&lt;typeid&gt;            types</text>
<text x="40" y="128" class="f-m s">oid:&lt;pkgid&gt;:1#realm     realm records</text>
<text x="40" y="143" class="f-m s">pkgidx:                 the list of uploads</text>
<text x="40" y="158" class="f-m s">commits with no hash: not in the application hash</text>
</g>
<g class="f-hot " data-note="Only the Merkle tree&#x27;s contents feed the application hash: package files, escaped hashes, inert packages, and the other keepers&#x27; accounts, balances and parameters." tabindex="0">
<rect x="385" y="62" width="345" height="118" rx="6" class="f-box acc"/>
<text x="395" y="80" class="f-t b">iavlStore: the B+32 tree on mainKey</text>
<text x="395" y="98" class="f-m s">pkg:&lt;path&gt;              production files</text>
<text x="395" y="113" class="f-m s">pkg:&lt;path&gt;#allbutprod   test files</text>
<text x="395" y="128" class="f-m s">inert_pkg:&lt;path&gt;        inert packages</text>
<text x="395" y="143" class="f-m s">&lt;pkgid&gt;:&lt;newtime&gt;       escaped object hashes</text>
<text x="395" y="158" class="f-m s">its root feeds the application hash</text>
</g>
<g class="f-hot " data-note="The keeper forks the store from the base app&#x27;s begin hook; the end hook calls Write only when the transaction succeeded." tabindex="0">
<rect x="20" y="206" width="232" height="140" rx="6" class="f-box "/>
<text x="30" y="224" class="f-t b">Per transaction</text>
<text x="30" y="240" class="f-t s">BeginTransaction forks the store</text>
<text x="30" y="253" class="f-t s">with fresh object, type and realm</text>
<text x="30" y="266" class="f-t s">caches and a write log around the</text>
<text x="30" y="279" class="f-t s">syntax-node cache. Write seals</text>
<text x="30" y="292" class="f-t s">and publishes the log, only when</text>
<text x="30" y="305" class="f-t s">the transaction succeeded.</text>
</g>
<g class="f-hot " data-note="The two hooks make the store complete; the in-memory standard library keeps library reads free of I/O gas." tabindex="0">
<rect x="264" y="206" width="232" height="140" rx="6" class="f-box "/>
<text x="274" y="224" class="f-t b">Hooks</text>
<text x="274" y="240" class="f-t s">PackageGetter loads a package</text>
<text x="274" y="253" class="f-t s">from disk on first import,</text>
<text x="274" y="266" class="f-t s">off-chain only. NativeResolver</text>
<text x="274" y="279" class="f-t s">attaches the Go body of a native</text>
<text x="274" y="292" class="f-t s">function. Standard library</text>
<text x="274" y="305" class="f-t s">objects and types sit in memory</text>
<text x="274" y="318" class="f-t s">from node start: no I/O gas.</text>
</g>
<g class="f-hot " data-note="The object cache is per message; the garbage-collection pass keeps it from growing within one." tabindex="0">
<rect x="508" y="206" width="232" height="140" rx="6" class="f-box "/>
<text x="518" y="224" class="f-t b">Between messages</text>
<text x="518" y="240" class="f-t s">ClearObjectCache runs at the</text>
<text x="518" y="253" class="f-t s">start of every message so nothing</text>
<text x="518" y="266" class="f-t s">leaks between them.</text>
<text x="518" y="279" class="f-t s">GarbageCollectObjectCache drops</text>
<text x="518" y="292" class="f-t s">the cached objects the last</text>
<text x="518" y="305" class="f-t s">garbage-collection pass did not</text>
<text x="518" y="318" class="f-t s">reach.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 250" width="760" height="250" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="250" class="f-bg" rx="8"/>
<g class="f-hot " data-note="The common case. A tree of singly referenced objects is one Merkle chain, saved with its root." tabindex="0">
<rect x="20" y="36" width="234" height="190" rx="6" class="f-box acc"/>
<text x="30" y="56" class="f-t b">Owned: RefCount 1</text>
<rect x="50" y="74" width="44" height="22" rx="4" class="f-box mut"/>
<text x="72" y="89" class="f-t s" text-anchor="middle">holder</text>
<path d="M72 96 L137 118" class="f-ar thin"/>
<rect x="112" y="118" width="50" height="24" rx="4" class="f-box mut"/>
<text x="137" y="134" class="f-t s" text-anchor="middle">object</text>
<text x="30" y="164" class="f-t s">one holder</text>
<text x="30" y="178" class="f-t s">owner id set</text>
<text x="30" y="192" class="f-t s">hash folded into the owner&#x27;s bytes</text>
<text x="30" y="206" class="f-t s">one Merkle chain down the tree</text>
</g>
<g class="f-hot " data-note="The second reference makes the object independent. The separate Merkle index of escaped hashes is a stub at this commit." tabindex="0">
<rect x="266" y="36" width="234" height="190" rx="6" class="f-box "/>
<text x="276" y="56" class="f-t b">Escaped: RefCount 2</text>
<rect x="296" y="74" width="44" height="22" rx="4" class="f-box mut"/>
<text x="318" y="89" class="f-t s" text-anchor="middle">holder</text>
<path d="M318 96 L383 118" class="f-ar thin"/>
<rect x="356" y="74" width="44" height="22" rx="4" class="f-box mut"/>
<text x="378" y="89" class="f-t s" text-anchor="middle">holder</text>
<path d="M378 96 L383 118" class="f-ar thin"/>
<rect x="358" y="118" width="50" height="24" rx="4" class="f-box mut"/>
<text x="383" y="134" class="f-t s" text-anchor="middle">object</text>
<text x="276" y="164" class="f-t s">two holders</text>
<text x="276" y="178" class="f-t s">owner cleared, saved on its own</text>
<text x="276" y="192" class="f-t s">hash written to the IAVL store under its id</text>
<text x="276" y="206" class="f-t s">once escaped, always escaped</text>
</g>
<g class="f-hot " data-note="processNewDeletedMarks decrements the children recursively, so a dropped subtree goes in one pass." tabindex="0">
<rect x="512" y="36" width="234" height="190" rx="6" class="f-box warn"/>
<text x="522" y="56" class="f-t b">Deleted: RefCount 0</text>
<rect x="604" y="118" width="50" height="24" rx="4" class="f-box warn"/>
<text x="629" y="134" class="f-t s" text-anchor="middle">object</text>
<path d="M604 118 L654 142 M654 118 L604 142" class="f-ln warn thin"/>
<text x="522" y="164" class="f-t s">no holder left</text>
<text x="522" y="178" class="f-t s">removed with everything it owned</text>
<text x="522" y="192" class="f-t s">cycles are not supported</text>
<text x="522" y="206" class="f-t s">named for a later phase</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 364" width="760" height="364" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="364" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-m b">for i := 0; i &lt; n; i++ { body }</text>
<g class="f-hot " data-note="Every for, range, switch and function call pushes a frame, so break, continue and return know how far to unwind." tabindex="0">
<rect x="20" y="40" width="200" height="80" rx="6" class="f-box "/>
<text x="30" y="58" class="f-t b">Frame</text>
<text x="30" y="74" class="f-t s">label, stack heights to</text>
<text x="30" y="87" class="f-t s">unwind to</text>
</g>
<g class="f-hot " data-note="The loop block owns a bodyStmt that remembers the next statement index, the condition and the post statement. The sticky OpForLoop walks that state." tabindex="0">
<rect x="236" y="40" width="214" height="80" rx="6" class="f-box "/>
<text x="246" y="58" class="f-t b">Block</text>
<text x="246" y="74" class="f-t s">i.loopvar, and the cursor</text>
<text x="246" y="87" class="f-t s">bodyStmt: next statement</text>
<text x="246" y="100" class="f-t s">index, condition, post</text>
<text x="246" y="113" class="f-t s">statement</text>
</g>
<g class="f-hot " data-note="Evaluate the condition." tabindex="0">
<rect x="20" y="140" width="100" height="36" rx="6" class="f-box acc"/>
<text x="30" y="155" class="f-t b">Cond</text>
</g>
<g class="f-hot " data-note="One body statement per turn of OpForLoop; the index advances." tabindex="0">
<rect x="170" y="140" width="190" height="36" rx="6" class="f-box acc"/>
<text x="180" y="155" class="f-t b">next body statement</text>
</g>
<g class="f-hot " data-note="Captured loop variables get fresh heap items, i++ runs, then back to the condition. continue jumps here." tabindex="0">
<rect x="380" y="140" width="76" height="36" rx="6" class="f-box acc"/>
<text x="390" y="155" class="f-t b">Post</text>
</g>
<path d="M120 158L169 158" class="f-ar "/>
<text x="132" y="152" class="f-t s">true</text>
<path d="M360 158L379 158" class="f-ar "/>
<path d="M418 176 C418 215 70 215 70 176" class="f-ar "/>
<text x="20" y="230" class="f-t s">OpForLoop is sticky: it stays on the stack, so loops do not recurse</text>
<g class="f-hot " data-note="Leaving the loop restores the stacks to the heights the frame recorded." tabindex="0">
<rect x="20" y="244" width="430" height="64" rx="6" class="f-box mut"/>
<text x="30" y="262" class="f-t b">Cond false, or break</text>
<text x="30" y="278" class="f-t s">pop the block, pop the frame, drop the sticky opcode. break and</text>
<text x="30" y="291" class="f-t s">continue pop frames until the loop with the right label.</text>
</g>
<g class="f-hot " data-note="An if pushes no frame, because no branch statement targets an if. OpPopBlock releases its block afterwards." tabindex="0">
<rect x="470" y="36" width="270" height="74" rx="6" class="f-box "/>
<text x="480" y="54" class="f-t b">if</text>
<text x="480" y="70" class="f-t s">pushes a block only, no frame; the</text>
<text x="480" y="83" class="f-t s">block is expanded with the chosen arm&#x27;s</text>
<text x="480" y="96" class="f-t s">names</text>
</g>
<g class="f-hot " data-note="default runs only once every other clause has failed. fallthrough swaps in the next clause&#x27;s names. A type switch also checks each interface case against the value&#x27;s methods." tabindex="0">
<rect x="470" y="116" width="270" height="74" rx="6" class="f-box "/>
<text x="480" y="134" class="f-t b">switch</text>
<text x="480" y="150" class="f-t s">a frame and one shared block; cases</text>
<text x="480" y="163" class="f-t s">tried one at a time; default runs last;</text>
<text x="480" y="176" class="f-t s">a type switch compares type ids</text>
</g>
<g class="f-hot " data-note="Arrays and slices, with pointers to arrays under their own opcode; strings, one rune per step; maps, one list entry per step, in insertion order." tabindex="0">
<rect x="470" y="196" width="270" height="74" rx="6" class="f-box "/>
<text x="480" y="214" class="f-t b">range</text>
<text x="480" y="230" class="f-t s">one opcode per kind: arrays and slices,</text>
<text x="480" y="243" class="f-t s">pointers to arrays, strings one rune</text>
<text x="480" y="256" class="f-t s">per step, maps one entry per step</text>
</g>
<g class="f-hot " data-note="The preprocessor counted the frames and blocks between the goto and its label, and the label&#x27;s statement index." tabindex="0">
<rect x="470" y="276" width="270" height="74" rx="6" class="f-box "/>
<text x="480" y="294" class="f-t b">goto</text>
<text x="480" y="310" class="f-t s">pops frames and blocks, cuts the stacks</text>
<text x="480" y="323" class="f-t s">back to the heights of the target body,</text>
<text x="480" y="336" class="f-t s">moves its cursor to the label</text>
</g>
</svg>

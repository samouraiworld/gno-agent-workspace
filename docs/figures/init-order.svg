<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 260" width="760" height="260" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="260" class="f-bg" rx="8"/>
<g class="f-hot " data-note="a reads b" tabindex="0">
<rect x="20" y="44" width="300" height="36" rx="6" class="f-box "/>
<text x="30" y="59" class="f-m">var a = mark(&quot;a&quot;, b+1)</text>
</g>
<g class="f-hot " data-note="b calls f, which reads c" tabindex="0">
<rect x="20" y="92" width="300" height="36" rx="6" class="f-box "/>
<text x="30" y="107" class="f-m">var b = mark(&quot;b&quot;, f())</text>
</g>
<g class="f-hot " data-note="a function runs nothing at init; its reads count for its callers" tabindex="0">
<rect x="20" y="140" width="300" height="36" rx="6" class="f-box "/>
<text x="30" y="155" class="f-m">func f() int { return c }</text>
</g>
<g class="f-hot " data-note="c reads nothing" tabindex="0">
<rect x="20" y="188" width="300" height="36" rx="6" class="f-box "/>
<text x="30" y="203" class="f-m">var c = mark(&quot;c&quot;, 2)</text>
</g>
<text x="20" y="236" class="f-t s">Dependencies recorded by codaInitOrderDeps, method bodies included</text>
<path d="M320 62 C360 62 360 110 320 110" class="f-ar "/>
<path d="M320 110 C360 110 360 158 320 158" class="f-ar "/>
<path d="M320 158 C360 158 360 206 320 206" class="f-ar "/>
<text x="368" y="86" class="f-t s">reads</text>
<text x="368" y="134" class="f-t s">calls</text>
<text x="368" y="182" class="f-t s">reads</text>
<g class="f-hot " data-note="A topological sort over the recorded reads. A min-heap breaks ties by declaration order. A cycle panics with the chain of names." tabindex="0">
<rect x="440" y="44" width="300" height="86" rx="6" class="f-box acc"/>
<text x="450" y="62" class="f-t b">Kahn&#x27;s sort, ties by declaration order</text>
<text x="450" y="81" class="f-m">1 c = 2</text>
<text x="450" y="97" class="f-m">2 b = f() = 2</text>
<text x="450" y="113" class="f-m">3 a = b + 1 = 3</text>
</g>
<g class="f-hot " data-note="Measured with gno test. The file order is a, b, f, c; the run order is c, b, a." tabindex="0">
<rect x="440" y="146" width="300" height="74" rx="6" class="f-box mut"/>
<text x="450" y="164" class="f-t b">Output of the filetest</text>
<text x="450" y="182" class="f-m">init c 2</text>
<text x="450" y="197" class="f-m">init b 2</text>
<text x="450" y="212" class="f-m">init a 3</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 760 700" width="760" height="700" font-family="ui-sans-serif, system-ui, sans-serif">
<style>
.f-bg{fill:#fbfaf7}
.f-box{fill:#fff;stroke:#c9c4b6;stroke-width:1}
.f-box.acc{fill:#e4f1ec;stroke:#226b5b}
.f-box.warn{fill:#fbeaea;stroke:#b3423f}
.f-box.mut{fill:#f1efe9}
.f-box.dash{stroke-dasharray:4 3}
.f-t{font:13px ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2422;white-space:pre}
.f-t.b{font-weight:700}
.f-t.h{font-size:15px;font-weight:700}
.f-t.s{font-size:11.5px;fill:#4f5652}
.f-t.acc{fill:#226b5b}
.f-t.warn{fill:#b3423f}
.f-m{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1f2422;white-space:pre}
.f-m.b{font-weight:700}
.f-m.s{font-size:11px;fill:#4f5652}
.f-m.acc{fill:#226b5b}
.f-m.warn{fill:#b3423f}
.f-ar{stroke:#6b726e;stroke-width:1.4;fill:none;marker-end:url(#f-ah)}
.f-ar.acc{stroke:#226b5b;marker-end:url(#f-ah2)}
.f-ar.warn{stroke:#b3423f;marker-end:url(#f-ah3)}
.f-ar.thin{stroke-width:1;stroke:#b9b4a6}
.f-ar.dash{stroke-dasharray:4 3}
.f-ln{stroke:#c9c4b6;stroke-width:1;fill:none}
.f-hot{cursor:pointer}
</style>
<defs>
<marker id="f-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b726e"/></marker>
<marker id="f-ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#226b5b"/></marker>
<marker id="f-ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b3423f"/></marker>
</defs>
<rect width="760" height="700" class="f-bg" rx="8"/>
<text x="20" y="24" class="f-t h">Source: names_filetest.gno, a realm at gno.land/r/demo/names</text>
<text x="20" y="46" class="f-m">package names</text>
<text x="20" y="62" class="f-m"></text>
<text x="20" y="78" class="f-m">var total int</text>
<text x="20" y="94" class="f-m"></text>
<text x="20" y="110" class="f-m">func add(n int) int {</text>
<text x="20" y="126" class="f-m">    sum := total</text>
<text x="20" y="142" class="f-m">    for i := 0; i &lt; n; i++ {</text>
<text x="20" y="158" class="f-m">        if i%2 == 0 {</text>
<text x="20" y="174" class="f-m">            sum += i</text>
<text x="20" y="190" class="f-m">        }</text>
<text x="20" y="206" class="f-m">    }</text>
<text x="390" y="46" class="f-m">    f := func() int { return sum + n }</text>
<text x="390" y="62" class="f-m">    return f()</text>
<text x="390" y="78" class="f-m">}</text>
<text x="390" y="94" class="f-m"></text>
<text x="390" y="110" class="f-m">func main(cur realm) {</text>
<text x="390" y="126" class="f-m">    total = 1</text>
<text x="390" y="142" class="f-m">    println(add(3))</text>
<text x="390" y="158" class="f-m">}</text>
<text x="20" y="236" class="f-t h">After preprocessing, as the filetest directive Preprocessed: prints it</text>
<text x="20" y="258" class="f-m">package names</text>
<text x="20" y="275" class="f-m">var <tspan class="f-hot" data-note="Declared in the file block, so the path climbs one block to the package block and takes slot 0. The ! marks the defining occurrence; the ~ says the slot holds a heap item, which is how every package variable is stored.">total&lt;!~VPBlock(2,0)&gt;</tspan> (const-type int)</text>
<text x="20" y="292" class="f-m">func add(<tspan class="f-hot" data-note="A parameter, slot 0 of add&#x27;s block. The ~ says it lives in a heap item, because the closure below captures it.">n~ (const-type int)</tspan>) <tspan class="f-hot" data-note="The unnamed result gets a hidden name and slot 1. A dot makes it unspellable from source.">.res.0</tspan> (const-type int) {</text>
<text x="20" y="309" class="f-m">    <tspan class="f-hot" data-note="Defined in add&#x27;s own block (depth 1), slot 2: n is 0, .res.0 is 1, sum is 2, f is 3. Heap item, since the closure captures sum.">sum&lt;!~VPBlock(1,2)&gt;</tspan> := <tspan class="f-hot" data-note="Three hops up from add&#x27;s block: file block, then package block, slot 0. The read goes through the heap item.">total&lt;~VPBlock(3,0)&gt;</tspan></text>
<text x="20" y="326" class="f-m">    for <tspan class="f-hot" data-note="The loop variable is renamed with a .loopvar suffix so it cannot collide with a same-named declaration in the body. Slot 0 of the for block. No ~: nothing captures it.">i.loopvar&lt;!VPBlock(1,0)&gt;</tspan> := (const (0 int));</text>
<text x="20" y="343" class="f-m">        i.loopvar&lt;VPBlock(1,0)&gt; &lt; <tspan class="f-hot" data-note="From the for block, n is one hop up, in add&#x27;s block, slot 0.">n&lt;~VPBlock(2,0)&gt;</tspan>; i.loopvar&lt;VPBlock(1,0)&gt;++ {</text>
<text x="20" y="360" class="f-m">        if <tspan class="f-hot" data-note="The if arm has its own block, so i is now two hops up.">i.loopvar&lt;VPBlock(2,0)&gt;</tspan> % <tspan class="f-hot" data-note="A literal the preprocessor folded into a ConstExpr carrying the finished typed value.">(const (2 int))</tspan> == (const (0 int)) {</text>
<text x="20" y="377" class="f-m">            <tspan class="f-hot" data-note="From the if block: for block, add&#x27;s block, slot 2. Same variable as above, one more hop.">sum&lt;~VPBlock(3,2)&gt;</tspan> += i.loopvar&lt;VPBlock(2,0)&gt;</text>
<text x="20" y="394" class="f-m">        }</text>
<text x="20" y="411" class="f-m">    }</text>
<text x="20" y="428" class="f-m">    <tspan class="f-hot" data-note="Slot 3 of add&#x27;s block. A function value, not a heap item: nothing takes its address.">f&lt;!VPBlock(1,3)&gt;</tspan> := func func() .res.0 (const-type int){</text>
<text x="20" y="445" class="f-m">        return <tspan class="f-hot" data-note="Inside the closure the captured sum sits in the closure&#x27;s own block at slot 1, after its .res.0 at slot 0. Every call copies the captured heap items into a fresh block.">sum&lt;~VPBlock(1,1)&gt;</tspan> + <tspan class="f-hot" data-note="The captured n, slot 2 of the closure&#x27;s block.">n&lt;~VPBlock(1,2)&gt;</tspan></text>
<text x="20" y="462" class="f-m">    }<tspan class="f-hot" data-note="The capture list. When the closure is created, the heap items at slots 2 and 0 of add&#x27;s block are copied into FuncValue.Captures. The ()~ marks a closure capture.">&lt;sum&lt;()~VPBlock(1,2)&gt;, n&lt;()~VPBlock(1,0)&gt;&gt;</tspan></text>
<text x="20" y="479" class="f-m">    return f&lt;VPBlock(1,3)&gt;()</text>
<text x="20" y="496" class="f-m">}</text>
<text x="20" y="513" class="f-m">func main(<tspan class="f-hot" data-note="The crossing parameter. Its type is the realm interface from the universe block.">cur (const-type .uverse.realm)</tspan>) {</text>
<text x="20" y="530" class="f-m">    total&lt;~VPBlock(3,0)&gt; = (const (1 int))</text>
<text x="20" y="547" class="f-m">    <tspan class="f-hot" data-note="A builtin resolves at preprocess time into a constant holding the function value.">(const (println func(...interface {})))</tspan>(<tspan class="f-hot" data-note="From main&#x27;s block: file block, package block, slot 1. Package slots: total 0, add 1, main 2.">add&lt;VPBlock(3,1)&gt;</tspan>((const (3 int))))</text>
<text x="20" y="564" class="f-m">}</text>
<rect x="20" y="589" width="720" height="88" rx="6" class="f-box mut"/>
<text x="30" y="607" class="f-t s">name&lt;VPBlock(d, i)&gt;: climb d − 1 parent blocks, take slot i. Depth 0 means the universe block.</text>
<text x="30" y="624" class="f-t s">!  the defining occurrence      ~  the slot holds a heap item      ()~  captured into a closure when it is created</text>
<text x="30" y="641" class="f-t s">(const ...)  folded by the preprocessor      .loopvar  .res.0  .uverse  hidden names no source can spell</text>
<text x="30" y="658" class="f-t s">Measured by running the filetest with gno test at this commit; the site shows a note for each highlighted token.</text>
</svg>

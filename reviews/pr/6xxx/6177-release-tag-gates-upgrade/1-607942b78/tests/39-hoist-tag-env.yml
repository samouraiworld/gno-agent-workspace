# Candidate #39: .github/workflows/release-chain-tag.yml:68 — hoist the
# four inlined `${{ inputs.tag || github.ref_name }}` copies (lines 68, 94,
# 135, 147 at PR head) back to one job-level `env:` per job, as the base
# commit already did for the equivalent `RAW_TAG` expression.
#
# Repro, from a local clone of gnolang/gno:
#   gh pr checkout 6177 -R gnolang/gno && git checkout 607942b78fa4fdf6f378fecce32bc1d1d984ab8e
#   grep -c 'inputs.tag || github.ref_name' .github/workflows/release-chain-tag.yml   # -> 4
#   git show 1fc4c140ec4064e8d66cb9828ddea280a723cca6:.github/workflows/release-chain-tag.yml \
#     | grep -n 'RAW_TAG:'   # proves job-level env with this exact expression parsed and ran pre-PR
#
# Before (head, 149 lines total): 4 inlined copies of the same expression,
# two per job, at lines 68, 94 (job `binaries`) and 135, 147 (job `release`).
# After (this rewrite, 145 lines total): 2 job-level env lines, one per job,
# every step referencing $TAG. Net: -4 inlined expressions, +2 hoisted lines.
#
# This is the `binaries:` and `release:` jobs only; the rest of the file is
# unchanged from PR head.

  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            native: true # runs on the builder, so the version can be asserted
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            native: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # zizmor: cache-poisoning — this job publishes artifacts

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ env.TAG }}
        run: |
          # -trimpath so the build does not depend on the checkout path.
          LDFLAGS="-w -s -X github.com/gnolang/gno/tm2/pkg/version.Version=${VERSION}"
          SUFFIX="${GOOS}_${GOARCH}"
          mkdir -p dist
          for target in \
            gnoland:./gno.land/cmd/gnoland \
            gnokey:./gno.land/cmd/gnokey \
            gnoweb:./gno.land/cmd/gnoweb \
            gno:./gnovm/cmd/gno
          do
            name="${target%%:*}"
            pkg="${target#*:}"
            echo "Building ${name}..."
            go build -trimpath -ldflags "$LDFLAGS" -o "dist/${name}_${SUFFIX}" "$pkg"
          done
          (cd dist && shasum -a 256 ./* > "checksums_${SUFFIX}.txt")

      # The binaries must report the tag, not "develop". A release built without
      # the ldflags looks identical on the release page and satisfies no
      # halt_min_version, which is only discovered when a chain will not restart.
      - name: Assert the binaries carry the tag
        if: matrix.native
        env:
          SUFFIX: ${{ matrix.goos }}_${{ matrix.goarch }}
          VERSION: ${{ env.TAG }}
          GNOROOT: ${{ github.workspace }}
        run: |
          for name in gnoland gnokey gno; do
            got="$("./dist/${name}_${SUFFIX}" version 2>/dev/null | awk -v n="$name" '$1 == n && $2 == "version:" {print $3}')"
            if [ "$got" != "$VERSION" ]; then
              echo "::error::${name} reports '${got}', expected '${VERSION}' — the -ldflags did not apply"
              exit 1
            fi
            echo "${name}: ${got}"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create/upload release assets
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd dist
          cat checksums_*.txt | sort > CHECKSUMS.txt
          rm -f checksums_*.txt

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --generate-notes \
              --verify-tag

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber

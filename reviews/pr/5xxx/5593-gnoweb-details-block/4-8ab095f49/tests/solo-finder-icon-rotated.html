<!doctype html>
<!--
solo-finder-icon-rotated: a <gno-icon /> in a :::details summary is rotated by the chevron rule.
Repro from a plain clone of gnolang/gno at 8ab095f495322cb3f1577ce39d1440de5c141477:
  cp gno.land/pkg/gnoweb/public/main.css <dir>/main.css && cp solo-finder-icon-rotated.html <dir>/
  chromium --headless --disable-gpu --dump-dom file://<dir>/solo-finder-icon-rotated.html | grep -A6 '<pre id="out">'
  chromium --headless --disable-gpu --window-size=520,420 --screenshot=<dir>/shot.png file://<dir>/solo-finder-icon-rotated.html
The markup below is the head's renderer output for
  :::details <gno-icon name="star" /> Logs / body / :::   (closed and [open])
and for the alert with the same title, from go test in gno.land/pkg/gnoweb/markdown.
Expected: the star in the details summary has transform none, like the alert's.
-->
<html><head><link rel="stylesheet" href="main.css"><style>body{padding:20px;width:460px}</style></head>
<body><div class="c-realm-view">
<details class="gno-details" id="closed">
<summary><svg><use href="#ico-arrow"></use></svg><svg class="gno-icon" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7.5 11.5-5 3 2-5.131-4-3.869h5l2-5 2 5h5l-4 4 2 5z" transform="translate(3 3)"/></svg> Logs</summary>
<div>
<p>body</p>
</div>
</details>
<details class="gno-details" id="open" open>
<summary><svg><use href="#ico-arrow"></use></svg><svg class="gno-icon" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7.5 11.5-5 3 2-5.131-4-3.869h5l2-5 2 5h5l-4 4 2 5z" transform="translate(3 3)"/></svg> Logs</summary>
<div>
<p>body</p>
</div>
</details>
<details class="gno-alert gno-alert-note" id="alert" open>
<summary>
<svg><use href="#ico-note"></use></svg><svg class="gno-icon" viewBox="0 0 21 21" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m7.5 11.5-5 3 2-5.131-4-3.869h5l2-5 2 5h5l-4 4 2 5z" transform="translate(3 3)"/></svg> Logs<svg><use href="#ico-arrow"></use></svg>
</summary>
<div>
<p>body</p>
</div>
</details>
</div>
<pre id="out"></pre>
<script>
const rows = [];
for (const id of ["closed", "open", "alert"]) {
  const s = getComputedStyle(document.querySelector("#" + id + " .gno-icon"));
  rows.push(id + " gno-icon transform=" + s.transform + " width=" + s.width + " color=" + s.color);
}
document.getElementById("out").textContent = rows.join("\n");
</script>
</body></html>
